run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - unconvert
    - unparam
    - gosec
    - bodyclose
    - noctx
    - exhaustive
    - gocritic
    - revive
    - prealloc

linters-settings:
  errcheck:
    check-type-assertions: true
  govet:
    enable-all: true
  revive:
    rules:
      - name: exported
        arguments:
          - "checkPrivateReceivers"
      - name: unused-parameter
  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
issues:
  exclude-rules:
    # Disable gosec and errcheck in test files as test helpers intentionally ignore errors and use simple mock setups
    - path: _test\.go
      linters:
        - gosec
        - errcheck
  max-same-issues: 0
