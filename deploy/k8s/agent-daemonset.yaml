apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-control-agent
  namespace: kube-system
  labels:
    app.kubernetes.io/name: k8s-control-agent
    app.kubernetes.io/part-of: k8sselfhost
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-control-agent
  labels:
    app.kubernetes.io/name: k8s-control-agent
    app.kubernetes.io/part-of: k8sselfhost
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-control-agent
  labels:
    app.kubernetes.io/name: k8s-control-agent
    app.kubernetes.io/part-of: k8sselfhost
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-control-agent
subjects:
  - kind: ServiceAccount
    name: k8s-control-agent
    namespace: kube-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: k8s-control-agent
  namespace: kube-system
  labels:
    app.kubernetes.io/name: k8s-control-agent
    app.kubernetes.io/part-of: k8sselfhost
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: k8s-control-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k8s-control-agent
        app.kubernetes.io/part-of: k8sselfhost
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: k8s-control-agent
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - operator: Exists
      containers:
        - name: agent
          image: k8sselfhost/k8s-agent:latest
          imagePullPolicy: IfNotPresent
          command: ["/app/k8s-agent", "--port", "9100", "--log-dir", "/var/log"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: AGENT_PORT
              value: "9100"
          ports:
            - name: metrics
              containerPort: 9100
              hostPort: 9100
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 9100
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 9100
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: proc
              mountPath: /proc
              readOnly: true
            - name: sys
              mountPath: /sys
              readOnly: true
            - name: varlog
              mountPath: /var/log
              readOnly: true
      volumes:
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
        - name: varlog
          hostPath:
            path: /var/log
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-control-agent
  namespace: kube-system
  labels:
    app.kubernetes.io/name: k8s-control-agent
    app.kubernetes.io/part-of: k8sselfhost
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: k8s-control-agent
  ports:
    - name: metrics
      port: 9100
      targetPort: 9100
      protocol: TCP
