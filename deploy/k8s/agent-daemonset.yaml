apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-control-agent
  namespace: kube-system
  labels:
    app.kubernetes.io/name: k8s-control-agent
    app.kubernetes.io/part-of: k8sselfhost
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-control-agent
  labels:
    app.kubernetes.io/name: k8s-control-agent
    app.kubernetes.io/part-of: k8sselfhost
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-control-agent
  labels:
    app.kubernetes.io/name: k8s-control-agent
    app.kubernetes.io/part-of: k8sselfhost
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-control-agent
subjects:
  - kind: ServiceAccount
    name: k8s-control-agent
    namespace: kube-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: k8s-control-agent
  namespace: kube-system
  labels:
    app.kubernetes.io/name: k8s-control-agent
    app.kubernetes.io/part-of: k8sselfhost
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: k8s-control-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k8s-control-agent
        app.kubernetes.io/part-of: k8sselfhost
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: k8s-control-agent
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - operator: Exists
      securityContext:
        fsGroup: 65532
      initContainers:
        - name: init-agent-permissions
          image: busybox:1.36
          securityContext:
            runAsUser: 0
          command: ["sh", "-c", "mkdir -p /var/lib/k8s-agent/logengine && chown -R 65532:65532 /var/lib/k8s-agent"]
          volumeMounts:
            - name: agent-data
              mountPath: /var/lib/k8s-agent
      containers:
        - name: agent
          image: k8sselfhost/k8s-agent:0.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
          command: ["/agent", "--port", "9100", "--log-dir", "/var/log"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: AGENT_PORT
              value: "9100"
            - name: AGENT_ENGINE_DIR
              value: "/var/lib/k8s-agent/logengine"
            # Secret creation:
            # kubectl -n kube-system create secret generic k8s-control-agent-auth --from-literal=token=$(openssl rand -hex 32)
            - name: AGENT_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: k8s-control-agent-auth
                  key: token
            # Optional central Control Plane URL for agent auto-registration
            - name: CONTROL_PLANE_URL
              value: ""
          ports:
            - name: metrics
              containerPort: 9100
              hostPort: 9100
              protocol: TCP
          resources:
            requests:
              cpu: 25m
              memory: 25Mi
            limits:
              cpu: 150m
              memory: 50Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 9100
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 9100
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: proc
              mountPath: /proc
              readOnly: true
            - name: sys
              mountPath: /sys
              readOnly: true
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
            - name: docker-socket
              mountPath: /var/run/docker.sock
              readOnly: true
            - name: agent-data
              mountPath: /var/lib/k8s-agent
      volumes:
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlogpods
          hostPath:
            path: /var/log/pods
        - name: docker-socket
          hostPath:
            path: /var/run/docker.sock
        - name: agent-data
          hostPath:
            path: /var/lib/k8s-agent
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-control-agent
  namespace: kube-system
  labels:
    app.kubernetes.io/name: k8s-control-agent
    app.kubernetes.io/part-of: k8sselfhost
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: k8s-control-agent
  ports:
    - name: metrics
      port: 9100
      targetPort: 9100
      protocol: TCP
