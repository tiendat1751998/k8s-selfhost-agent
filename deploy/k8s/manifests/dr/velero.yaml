apiVersion: v1
kind: Namespace
metadata:
  name: velero
  labels:
    app.kubernetes.io/name: velero
    app.kubernetes.io/part-of: k8sselfhost
    app.kubernetes.io/component: disaster-recovery
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: velero
  namespace: velero
  labels:
    app.kubernetes.io/name: velero
    app.kubernetes.io/part-of: k8sselfhost
    app.kubernetes.io/component: disaster-recovery
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: velero
  labels:
    app.kubernetes.io/name: velero
    app.kubernetes.io/part-of: k8sselfhost
    app.kubernetes.io/component: disaster-recovery
rules:
  # Upstream Velero v1.14 / Helm chart least-privilege RBAC:
  # Full lifecycle control for Velero Custom Resource Definitions
  - apiGroups:
      - velero.io
    resources:
      - backups
      - backups/status
      - restores
      - restores/status
      - schedules
      - schedules/status
      - backupstoragelocations
      - backupstoragelocations/status
      - volumesnapshotlocations
      - volumesnapshotlocations/status
      - downloadrequests
      - downloadrequests/status
      - deletebackuprequests
      - deletebackuprequests/status
      - podvolumebackups
      - podvolumebackups/status
      - podvolumerestores
      - podvolumerestores/status
      - serverstatusrequests
      - serverstatusrequests/status
      - backuprepositories
      - backuprepositories/status
      - datauploads
      - datauploads/status
      - datadownloads
      - datadownloads/status
    verbs:
      - create
      - get
      - list
      - watch
      - update
      - patch
      - delete
  # CSI / Volume snapshot management for persistent disk backups
  - apiGroups:
      - snapshot.storage.k8s.io
    resources:
      - volumesnapshots
      - volumesnapshotcontents
      - volumesnapshotclasses
    verbs:
      - create
      - get
      - list
      - watch
      - update
      - patch
      - delete
  # Leader election coordination leases
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
      - get
      - list
      - watch
      - update
      - patch
      - delete
  # Cluster events generation
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
      - update
  # Read-only cluster discovery and backup access (Core APIs)
  - apiGroups:
      - ""
    resources:
      - namespaces
      - nodes
      - pods
      - pods/log
      - pods/status
      - services
      - endpoints
      - persistentvolumeclaims
      - persistentvolumes
      - configmaps
      - secrets
      - serviceaccounts
      - limitranges
      - resourcequotas
    verbs:
      - get
      - list
      - watch
  # Read-only workload backup access (Apps APIs)
  - apiGroups:
      - apps
    resources:
      - deployments
      - daemonsets
      - statefulsets
      - replicasets
    verbs:
      - get
      - list
      - watch
  # Read-only batch workload backup access (Batch APIs)
  - apiGroups:
      - batch
    resources:
      - jobs
      - cronjobs
    verbs:
      - get
      - list
      - watch
  # Read-only networking backup access
  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses
      - ingressclasses
      - networkpolicies
    verbs:
      - get
      - list
      - watch
  # Read-only storage backup access
  - apiGroups:
      - storage.k8s.io
    resources:
      - storageclasses
      - volumeattachments
      - csinodes
      - csidrivers
    verbs:
      - get
      - list
      - watch
  # Read-only autoscaling and policy backup access
  - apiGroups:
      - autoscaling
    resources:
      - horizontalpodautoscalers
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - policy
    resources:
      - poddisruptionbudgets
    verbs:
      - get
      - list
      - watch
  # Read-only RBAC and CRD metadata discovery
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - roles
      - rolebindings
      - clusterroles
      - clusterrolebindings
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: velero
  labels:
    app.kubernetes.io/name: velero
    app.kubernetes.io/part-of: k8sselfhost
    app.kubernetes.io/component: disaster-recovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: velero
subjects:
  - kind: ServiceAccount
    name: velero
    namespace: velero
---
# Separate dedicated ClusterRole for Velero disaster-recovery restore operations
# Scoped specifically to namespaced workloads and volume resources (create/patch/update)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: velero-restore
  labels:
    app.kubernetes.io/name: velero
    app.kubernetes.io/part-of: k8sselfhost
    app.kubernetes.io/component: disaster-recovery
rules:
  - apiGroups:
      - ""
    resources:
      - namespaces
      - persistentvolumes
      - persistentvolumeclaims
      - pods
      - services
      - endpoints
      - configmaps
      - secrets
      - serviceaccounts
      - limitranges
      - resourcequotas
    verbs:
      - create
      - patch
      - update
  - apiGroups:
      - apps
    resources:
      - deployments
      - daemonsets
      - statefulsets
      - replicasets
    verbs:
      - create
      - patch
      - update
  - apiGroups:
      - batch
    resources:
      - jobs
      - cronjobs
    verbs:
      - create
      - patch
      - update
  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses
      - networkpolicies
    verbs:
      - create
      - patch
      - update
  - apiGroups:
      - autoscaling
    resources:
      - horizontalpodautoscalers
    verbs:
      - create
      - patch
      - update
  - apiGroups:
      - policy
    resources:
      - poddisruptionbudgets
    verbs:
      - create
      - patch
      - update
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - roles
      - rolebindings
    verbs:
      - create
      - patch
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: velero-restore
  labels:
    app.kubernetes.io/name: velero
    app.kubernetes.io/part-of: k8sselfhost
    app.kubernetes.io/component: disaster-recovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: velero-restore
subjects:
  - kind: ServiceAccount
    name: velero
    namespace: velero
---
apiVersion: v1
kind: Secret
metadata:
  name: cloud-credentials
  namespace: velero
  labels:
    app.kubernetes.io/name: velero
    app.kubernetes.io/part-of: k8sselfhost
    app.kubernetes.io/component: disaster-recovery
type: Opaque
stringData:
  cloud: |
    [default]
    aws_access_key_id = minioadmin
    aws_secret_access_key = minioadmin
---
apiVersion: velero.io/v1
kind: BackupStorageLocation
metadata:
  name: default
  namespace: velero
  labels:
    app.kubernetes.io/name: velero
    app.kubernetes.io/part-of: k8sselfhost
    app.kubernetes.io/component: disaster-recovery
spec:
  provider: aws
  objectStorage:
    bucket: k8s-disaster-recovery
  config:
    region: minio
    s3ForcePathStyle: "true"
    s3Url: http://minio.storage.svc:9000
    insecureSkipTLSVerify: "true"
---
apiVersion: velero.io/v1
kind: VolumeSnapshotLocation
metadata:
  name: default
  namespace: velero
  labels:
    app.kubernetes.io/name: velero
    app.kubernetes.io/part-of: k8sselfhost
    app.kubernetes.io/component: disaster-recovery
spec:
  provider: aws
  config:
    region: minio
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: velero
  namespace: velero
  labels:
    app.kubernetes.io/name: velero
    app.kubernetes.io/part-of: k8sselfhost
    app.kubernetes.io/component: disaster-recovery
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: velero
  template:
    metadata:
      labels:
        app.kubernetes.io/name: velero
        app.kubernetes.io/part-of: k8sselfhost
        app.kubernetes.io/component: disaster-recovery
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8085"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: velero
      initContainers:
        - name: velero-plugin-for-aws
          image: velero/velero-plugin-for-aws:v1.10.0
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - mountPath: /target
              name: plugins
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
      containers:
        - name: velero
          image: velero/velero:v1.14.0
          imagePullPolicy: IfNotPresent
          command:
            - /velero
          args:
            - server
            - --uploader-type=kopia
          env:
            - name: VELERO_SCRATCH_DIR
              value: /scratch
            - name: VELERO_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: LD_LIBRARY_PATH
              value: /plugins
            - name: AWS_SHARED_CREDENTIALS_FILE
              value: /credentials/cloud
          ports:
            - name: metrics
              containerPort: 8085
              protocol: TCP
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - mountPath: /plugins
              name: plugins
            - mountPath: /scratch
              name: scratch
            - mountPath: /credentials
              name: cloud-credentials
      volumes:
        - name: plugins
          emptyDir: {}
        - name: scratch
          emptyDir: {}
        - name: cloud-credentials
          secret:
            secretName: cloud-credentials
