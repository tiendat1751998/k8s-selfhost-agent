apiVersion: v1
kind: Namespace
metadata:
  name: logging
  labels:
    app.kubernetes.io/name: logging
    app.kubernetes.io/part-of: k8sselfhost
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vector
  namespace: logging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vector
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vector
subjects:
  - kind: ServiceAccount
    name: vector
    namespace: logging
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-config
  namespace: logging
data:
  vector.yaml: |
    data_dir: /var/lib/vector
    api:
      enabled: true
      address: 0.0.0.0:8686

    sources:
      kubernetes_logs:
        type: kubernetes_logs
        auto_partial_merge: true

    transforms:
      parse_and_enrich:
        type: remap
        inputs: ["kubernetes_logs"]
        source: |
          .raw_message = .message
          structured, err = parse_json(.message)
          if err == null {
            . = merge(., structured)
          }
          .app = .kubernetes.pod_labels."app.kubernetes.io/name" ?? .kubernetes.pod_labels.app ?? .kubernetes.container_name ?? "unknown"
          .namespace = .kubernetes.pod_namespace ?? "default"
          .pod = .kubernetes.pod_name ?? "unknown"
          .container = .kubernetes.container_name ?? "unknown"
          .level = upcase(string!(.level ?? "INFO"))

      filter_probes:
        type: filter
        inputs: ["parse_and_enrich"]
        condition: '!match(.message, r"/livez|/readyz|/healthz")'

    sinks:
      loki:
        type: loki
        inputs: ["filter_probes"]
        endpoint: http://loki.logging.svc.cluster.local:3100
        encoding:
          codec: json
        labels:
          app: "{{ app }}"
          namespace: "{{ namespace }}"
          container: "{{ container }}"
          level: "{{ level }}"

      opensearch:
        type: elasticsearch
        inputs: ["filter_probes"]
        endpoints: ["http://opensearch.logging.svc.cluster.local:9200"]
        mode: bulk
        api_version: "v8"
        index: "k8s-logs-%Y.%m.%d"
        healthcheck:
          enabled: false
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vector
  namespace: logging
  labels:
    app.kubernetes.io/name: vector
    app.kubernetes.io/component: log-collector
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: vector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vector
    spec:
      serviceAccountName: vector
      tolerations:
        - effect: NoSchedule
          operator: Exists
        - effect: NoExecute
          operator: Exists
      containers:
        - name: vector
          image: timberio/vector:0.38.0-alpine
          args: ["--config-dir", "/etc/vector/"]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["DAC_READ_SEARCH"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          ports:
            - containerPort: 8686
              name: api
          volumeMounts:
            - name: config
              mountPath: /etc/vector
              readOnly: true
            - name: data
              mountPath: /var/lib/vector
            - name: var-log
              mountPath: /var/log
              readOnly: true
            - name: var-lib-docker-containers
              mountPath: /var/lib/docker/containers
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: vector-config
        - name: data
          emptyDir: {}
        - name: var-log
          hostPath:
            path: /var/log
        - name: var-lib-docker-containers
          hostPath:
            path: /var/lib/docker/containers
