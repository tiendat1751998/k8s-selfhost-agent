apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "https://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        # Hỗ trợ Kubernetes ServiceAccount token auth
        kubernetes:
          mountPath: "kubernetes"
          role: "k8sselfhost-role"
          serviceAccountRef:
            name: k8sselfhost
            namespace: k8sselfhost
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: k8sselfhost-vault-secrets
  namespace: k8sselfhost
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: k8sselfhost-synced-secret
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: database/production
        property: password
    - secretKey: JWT_SECRET
      remoteRef:
        key: auth/jwt
        property: secret
    - secretKey: BACKUP_ENCRYPTION_KEY
      remoteRef:
        key: backup/keys
        property: aes_key
