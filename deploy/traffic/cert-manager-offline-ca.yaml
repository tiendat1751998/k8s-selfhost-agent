apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: offline-enterprise-ca-issuer
spec:
  ca:
    secretName: enterprise-root-ca-key-pair # Secret chứa Root CA certificate và private key nội bộ
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: sre-admin@enterprise.internal
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            class: nginx
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: k8sselfhost-tls
  namespace: k8sselfhost
spec:
  secretName: k8sselfhost-tls-cert
  issuerRef:
    name: offline-enterprise-ca-issuer
    kind: ClusterIssuer
  commonName: k8sselfhost.local
  dnsNames:
    - k8sselfhost.local
    - "*.k8sselfhost.local"
    - localhost
  duration: 8760h # 1 year
  renewBefore: 720h # 30 days
