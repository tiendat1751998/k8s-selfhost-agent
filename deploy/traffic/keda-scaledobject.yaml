apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: k8sselfhost-worker-scaler
  namespace: k8sselfhost
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: k8sselfhost
  minReplicaCount: 1
  maxReplicaCount: 10
  cooldownPeriod: 300
  pollingInterval: 15
  triggers:
    # Trigger 1: Scale theo hàng đợi sự cố NATS JetStream
    - type: nats-jetstream
      metadata:
        natsServerMonitoringEndpoint: "nats.k8sselfhost.svc.cluster.local:8222"
        account: "$G"
        stream: "INCIDENTS"
        consumer: "INCIDENT_PROCESSOR"
        lagThreshold: "10"
    # Trigger 2: Scale theo độ dài hàng đợi Redis
    - type: redis
      metadata:
        address: "redis-master.k8sselfhost.svc.cluster.local:6379"
        listName: "k8sselfhost:backup:queue"
        listLength: "5"
    # Trigger 3: Scale theo CPU utilization
    - type: cpu
      metricType: Utilization
      metadata:
        value: "80"
