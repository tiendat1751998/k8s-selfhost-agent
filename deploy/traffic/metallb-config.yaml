apiVersion: v1
kind: Namespace
metadata:
  name: metallb-system
  labels:
    app.kubernetes.io/name: metallb
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: onprem-default-pool
  namespace: metallb-system
spec:
  addresses:
    - 192.168.1.200-192.168.1.250
    - 10.0.100.100-10.0.100.200
  autoAssign: true
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: onprem-l2-advertisement
  namespace: metallb-system
spec:
  ipAddressPools:
    - onprem-default-pool
---
apiVersion: metallb.io/v1beta1
kind: BGPAdvertisement
metadata:
  name: onprem-bgp-advertisement
  namespace: metallb-system
spec:
  ipAddressPools:
    - onprem-default-pool
  aggregationLength: 32
