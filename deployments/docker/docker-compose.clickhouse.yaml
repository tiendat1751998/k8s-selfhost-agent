services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: k8sselfhost-clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    mem_limit: 512m
    mem_reservation: 256m
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 256m
    command:
      - "--max_server_memory_usage=450000000"
      - "--mark_cache_size=67108864"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ../../migrations/clickhouse:/docker-entrypoint-initdb.d
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8123/ping | grep ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - k8sselfhost

volumes:
  clickhouse_data:

networks:
  k8sselfhost:
    name: k8sselfhost
