apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "k8sselfhost.fullname" . }}
  labels:
    {{- include "k8sselfhost.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "k8sselfhost.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "k8sselfhost.labels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "k8sselfhost.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.config.server.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            - name: K8S_SERVER_HOST
              value: "{{ .Values.config.server.host }}"
            - name: K8S_SERVER_PORT
              value: "{{ .Values.config.server.port }}"
            - name: K8S_POSTGRES_HOST
              value: "{{ .Values.config.postgres.host }}"
            - name: K8S_POSTGRES_PORT
              value: "{{ .Values.config.postgres.port }}"
            - name: K8S_POSTGRES_USER
              value: "{{ .Values.config.postgres.user }}"
            - name: K8S_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "k8sselfhost.fullname" . }}-secrets
                  key: postgres-password
            - name: K8S_POSTGRES_DBNAME
              value: "{{ .Values.config.postgres.dbname }}"
            - name: K8S_POSTGRES_SSLMODE
              value: "{{ .Values.config.postgres.sslmode }}"
            - name: K8S_REDIS_HOST
              value: "{{ .Values.config.redis.host }}"
            - name: K8S_REDIS_PORT
              value: "{{ .Values.config.redis.port }}"
            - name: K8S_NATS_URL
              value: "{{ .Values.config.nats.url }}"
            - name: K8S_LLM_PROVIDER
              value: "{{ .Values.config.llm.provider }}"
            - name: K8S_LLM_ENDPOINT
              value: "{{ .Values.config.llm.endpoint }}"
            - name: K8S_LLM_MODEL
              value: "{{ .Values.config.llm.model }}"
            - name: K8S_LOG_LEVEL
              value: "{{ .Values.config.logLevel }}"
            - name: K8S_TELEMETRY_SERVICE_NAME
              value: "{{ .Values.config.telemetry.serviceName }}"
            - name: K8S_TELEMETRY_ENVIRONMENT
              value: "{{ .Values.config.telemetry.environment }}"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
