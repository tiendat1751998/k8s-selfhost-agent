apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "k8sselfhost.fullname" . }}
  labels:
    {{- include "k8sselfhost.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "k8sselfhost.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow HTTP traffic from any source (ingress controller, services, etc.)
    - ports:
        - port: {{ .Values.config.server.port }}
          protocol: TCP
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Allow PostgreSQL
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - port: {{ .Values.config.postgres.port }}
          protocol: TCP
    # Allow Redis
    - ports:
        - port: {{ .Values.config.redis.port }}
          protocol: TCP
    # Allow NATS
    - ports:
        - port: 4222
          protocol: TCP
    # Allow Kubernetes API server
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
    # Allow LLM endpoint (configurable port)
    - ports:
        - port: 11434
          protocol: TCP
