apiVersion: v1
kind: Secret
metadata:
  name: {{ include "k8sselfhost.fullname" . }}-secrets
  labels:
    {{- include "k8sselfhost.labels" . | nindent 4 }}
type: Opaque
data:
  postgres-password: {{ .Values.config.postgres.password | b64enc | quote }}
  redis-password: {{ .Values.config.redis.password | default "" | b64enc | quote }}
  llm-api-key: {{ .Values.config.llm.apiKey | default "" | b64enc | quote }}
