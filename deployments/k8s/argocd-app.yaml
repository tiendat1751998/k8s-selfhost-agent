apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8sselfhost
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/datdt/k8sselfhost.git
    targetRevision: main
    path: deployments/helm/k8sselfhost
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: k8sselfhost
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
