apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8sselfhost
  namespace: k8sselfhost
  labels:
    app.kubernetes.io/name: k8sselfhost
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: k8sselfhost
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k8sselfhost
        app.kubernetes.io/component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: k8sselfhost
          image: k8sselfhost:0.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          env:
            - name: K8S_SERVER_HOST
              value: "0.0.0.0"
            - name: K8S_SERVER_PORT
              value: "8080"
            - name: K8S_POSTGRES_HOST
              value: "postgresql"
            - name: K8S_POSTGRES_PORT
              value: "5432"
            - name: K8S_POSTGRES_USER
              value: "postgres"
            - name: K8S_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: k8sselfhost-secret
                  key: postgres-password
            - name: K8S_POSTGRES_DBNAME
              value: "k8sselfhost"
            - name: K8S_POSTGRES_SSLMODE
              value: "disable"
            - name: K8S_REDIS_HOST
              value: "redis-master"
            - name: K8S_REDIS_PORT
              value: "6379"
            - name: K8S_NATS_URL
              value: "nats://nats:4222"
            - name: K8S_LOG_LEVEL
              value: "info"
